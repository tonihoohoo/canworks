[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "canworks"
version = "0.46.2"
description = "Configures CANopen for OpenPLC (canworks-config), deploys it to an OpenPLC Runtime v4 (canworks-deploy) and reads the live network (canworks-diag)"
readme = "README.md"
requires-python = ">=3.8"
license = {text = "Apache-2.0"}
dependencies = ["jsonschema>=4.0", "python-can>=4.3", "pyserial>=3.5", "cantools>=39", "can-j1939>=2.0.12",
                "python-can[gs-usb]>=4.3; sys_platform == 'darwin'",  # gs_usb adapters on macOS (needs libusb)
                "pywin32; sys_platform == 'win32'"]  # can-j1939's job thread (transport protocol) needs pythoncom

[project.scripts]
canworks-deploy = "canworks.cli:main"
canworks-config = "canworks.configurator.server:main"
canworks-diag = "canworks.diag:main"
canworks-sim-runtime = "canworks.localruntime:main"
canworks-j1939-sim = "canworks.j1939.sim:main"

[tool.setuptools]
packages = ["canworks", "canworks.bustrace", "canworks.localbus", "canworks.configurator", "canworks._lely_dcf",
            "canworks.j1939", "canworks.raw"]

[tool.setuptools.package-data]
canworks = ["schema/*.json", "library/*.stlib", "builtin_notes/*.json"]
"canworks.configurator" = ["static/*", "static/uplot/*", "static/three/*", "static/three/build/*", "static/three/addons/*/*"]
"canworks._lely_dcf" = ["LICENSE", "NOTICE", "VERSION", "README.md"]
