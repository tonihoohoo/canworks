[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "canworks"
version = "0.106.0"
description = "Configures CANopen for OpenPLC (canworks-config), deploys it to an OpenPLC Runtime v4 (canworks-deploy) and reads the live network (canworks-diag)"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "Apache-2.0"}
dependencies = ["jsonschema>=4.0", "python-can>=4.3", "pyserial>=3.5", "cantools>=39", "can-j1939>=2.0.12",
                "python-can[gs-usb]>=4.3; sys_platform == 'darwin' or sys_platform == 'win32'",  # gs_usb adapters
                "libusb>=1.0.30; sys_platform == 'win32'",  # the libusb DLL for gs_usb on Windows (macOS: brew install libusb)
                "pywin32; sys_platform == 'win32'",  # can-j1939's job thread (transport protocol) needs pythoncom
                "paramiko>=3.5",  # the Devices workspace: SSH to devices for probes and install jobs (docs/devices.md)
                "ifaddr>=0.2",  # the interfaces discovery asks on (pure Python; no listen socket, so no firewall question)
                # The remote link (docs/remote-access.md), where iroh publishes a wheel: Windows x64, macOS
                # arm64, Linux x86_64 and aarch64. A runtime dependency, not an extra: the configurator's and
                # canworks-diag's remote link must work after the one-line install (its wheels need nothing else).
                "iroh>=1.1,<1.2; platform_machine == 'AMD64' or platform_machine == 'arm64' or platform_machine == 'aarch64' or (platform_machine == 'x86_64' and sys_platform == 'linux')"]

[project.scripts]
canworks-deploy = "canworks.cli:main"
canworks-config = "canworks.configurator.start:main"
canworks-diag = "canworks.diag:main"
canworks-sim-runtime = "canworks.localruntime:main"
canworks-j1939-sim = "canworks.j1939.sim:main"
canworks-link = "canworks.link.device:main"

[tool.setuptools]
packages = ["canworks", "canworks.bustrace", "canworks.localbus", "canworks.configurator", "canworks._lely_dcf",
            "canworks.j1939", "canworks.raw", "canworks.link", "canworks.codesys", "canworks.devices"]

[tool.setuptools.package-data]
canworks = ["schema/*.json", "library/*.stlib", "builtin_notes/*.json"]
"canworks.configurator" = ["static/*", "static/uplot/*", "icons/*"]
"canworks.devices" = ["device-probe.sh"]
"canworks.codesys" = ["script/*.py"]
"canworks._lely_dcf" = ["LICENSE", "NOTICE", "VERSION", "README.md"]
