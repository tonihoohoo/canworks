<!doctype html>
<html lang="en" data-theme="{{THEME}}">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="canworks-token" content="{{TOKEN}}">
<title>canworks configurator</title>
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="stylesheet" href="uplot/uPlot.min.css">
<link rel="stylesheet" href="style.css">
<link rel="stylesheet" href="rawcan.css">
</head>
<body>
<header id="top">
  <div class="top-row">
  <h1>canworks configurator</h1>
  <button id="update-chip" type="button" class="update-chip" hidden></button>
  <div id="ws" class="segmented" role="group" aria-label="Workspace" hidden>
    <button type="button" data-ws="configure" title="Edit the config: networks, nodes, PDOs, exports">Configure</button><button type="button" data-ws="commission" data-view="online" title="Work on the live bus through the runtime">Commission</button><button type="button" data-ws="devices" data-view="devices" title="Install canworks on a Linux device over SSH">Devices</button>
  </div>
  <span id="mode" class="badge" hidden></span>
  <div id="sim-banner" class="sim-chip" data-notice="warning" role="note" hidden></div>
  <div class="spacer"></div>
  <div id="actions" hidden>
    <button id="btn-reload" type="button" data-config="1">Reload from disk</button>
    <button id="btn-close" type="button">Close</button>
    <details id="menu-export" class="menu" data-config="1">
      <summary aria-haspopup="true">Export</summary>
      <div class="menu-panel" role="group" aria-label="Export">
        <div class="menu-group" data-export-group="network"><span class="menu-heading" id="export-network-h">Network files</span>
        <button id="btn-export-all" type="button" class="item" title="Every node as a CiA 306 DCF file, checked, in one zip">All DCFs</button>
        <button id="btn-export-node" type="button" class="item" title="The open node as a CiA 306 DCF file, checked">This node's DCF</button>
        <div class="menu-row"><select id="dbc-sdo" aria-label="SDO frames in the DBC file" title="SDO frames in the DBC file">
          <option value="none">No SDO frames</option><option value="config">SDO: configured objects</option><option value="all">SDO: all EDS objects</option>
        </select><button id="btn-export-dbc" type="button" class="item" title="The network as a DBC file for CAN bus tools (PDOs, heartbeat, EMCY, NMT, SYNC)">DBC</button></div>
        <button id="btn-export-html" type="button" class="item" title="One HTML document of every network for people: CANopen topology, COB-ID map, nodes, PDO layouts and boot SDO writes; J1939 ECU, messages and signals; bus load and PLC I/O">Documentation</button>
        <button id="btn-codesys-download" type="button" class="item" hidden title="The node DCFs and a script that builds the CANbus, manager, nodes and variable names in CODESYS, as one zip">Download for CODESYS</button>
        </div>
      </div>
    </details>
    <button id="btn-codesys-build" type="button" class="primary" data-config="1" hidden title="Build the saved config into the CODESYS project with CODESYS on this PC">Build into CODESYS project…</button>
    <button id="btn-bridge-install" type="button" class="primary" data-config="1" hidden title="Install the bridge with this config on a Linux device, in the Devices workspace">Install on device…</button>
    <button id="btn-save" type="button" class="primary" data-config="1">Save</button>
  </div>
  <details id="menu-more" class="menu">
    <summary aria-haspopup="true" aria-label="More" title="More">⋯</summary>
    <div class="menu-panel" role="group" aria-label="More"></div>
  </details>
  <details id="menu-settings" class="menu">
    <summary aria-haspopup="true">Settings</summary>
    <div class="menu-panel" role="group" aria-label="Settings">
      <div class="menu-row"><span class="muted">Theme</span>
      <div id="theme" class="segmented" role="group" aria-label="Theme">
        <button type="button" data-theme-choice="light">Light</button><button type="button" data-theme-choice="dark">Dark</button><button type="button" data-theme-choice="auto">Auto</button>
      </div></div>
      <div class="menu-row update-row"><span class="muted">Updates</span>
        <label class="check" title="Asks GitHub once a day which PC tools release is the newest; nothing else is sent"><input id="update-check" type="checkbox"> Check for updates</label>
        <button id="update-check-now" type="button" class="item">Check now</button></div>
      <p id="update-status" class="muted update-status" aria-live="polite"></p>
      <details id="legend-box"><summary>Colours and icons</summary><div id="legend"></div></details>
    </div>
  </details>
  <button id="btn-quit" type="button" title="Stop canworks-config (it asks first); closing its last tab stops it too">Quit</button>
  </div>
  <div id="tab-row"><div id="tool-tabs" hidden></div><div id="conn-bar" hidden></div></div>
</header>
<div id="page-bars">
<div id="banner" class="notice notice-done" data-notice="done" role="status" hidden><div id="banner-text" class="notice-text"></div><button id="banner-close" class="notice-close" type="button" title="Close" aria-label="Close message">✕</button></div>
</div>
<main id="start" hidden>
  <p id="start-intro" class="start-intro">Set up CANopen and J1939 networks for a PLC or a Modbus bridge, work on a CANopen device directly from this PC, or install canworks on a Linux device.</p>
  <div class="start-actions">
    <button id="start-open" type="button" class="primary" title="Open an OpenPLC Editor project or a config folder">Open…</button>
    <button id="start-new" type="button" title="Start a new config for the Modbus bridge (OpenPLC and other clients connect to it) or CODESYS">New config…</button>
    <span class="spacer"></span>
    <button id="start-commission" type="button" class="link" title="A USB CAN adapter on this PC is enough: no runtime and no config">Commission a device without a config</button>
    <button id="start-devices" type="button" class="link" title="Install the Modbus bridge on a Linux device over SSH: no config needed">Install on a device</button>
  </div>
  <section id="start-first" class="start-first" aria-label="Where to start" hidden>
    <button id="start-first-open" type="button" class="choice"><strong>I have an OpenPLC project</strong><span>Open its folder. PLC addresses are checked against its program.</span></button>
    <button id="start-first-new" type="button" class="choice"><strong>Start something new</strong><span>For OpenPLC, a Modbus bridge (Node-RED, HMI) or CODESYS.</span></button>
    <button id="start-first-commission" type="button" class="choice"><strong>I just want to talk to a device</strong><span>A USB CAN adapter is enough: scan the bus, set node IDs, read and write parameters.</span></button>
    <button id="start-first-devices" type="button" class="choice"><strong>Set up a Linux device</strong><span>Install the Modbus bridge, its remote link and local network discovery over SSH. No config needed.</span></button>
  </section>
  <section id="start-recent">
    <h2>Recent</h2>
    <ul id="recent" class="folders recent"></ul>
  </section>
</main>
<main id="editor" hidden>
  <nav id="side" aria-label="Network">
    <button id="tree-toggle" type="button" aria-expanded="false" aria-controls="tree">Network ▾</button>
    <ul id="tree" role="tree" aria-label="Network"></ul>
    <ul id="tree-rail" aria-label="Network entries"></ul>
    <div id="tree-live" class="visually-hidden" aria-live="polite"></div>
    <label class="file-button" hidden>Add node from EDS… <input id="eds-input" type="file" accept=".eds,.EDS"></label>
    <div id="side-foot" data-config="1">
      <div id="unused-eds"></div>
      <p id="scan-info" class="muted"></p>
    </div>
  </nav>
  <section id="view" aria-label="Page"></section>
</main>
<footer id="bottom" hidden>
  <section id="problems" aria-label="Problems"><details id="problems-box" open>
    <summary><h2 class="side-caption">Problems</h2> <span id="problem-count" class="muted" aria-live="polite"></span></summary>
    <div id="problems-bars" class="notice-slot"></div>
    <ul id="problem-list" data-box="problems" data-box-label="the problems list"></ul>
  </details></section>
  <section id="log-panel" aria-label="Log" hidden><details id="log-box">
    <summary><h2 class="side-caption">Log</h2> <span id="log-count" class="muted" aria-live="polite"></span></summary>
    <div id="log-body"></div>
  </details></section>
  <div id="statusbar"><div id="jobs" aria-live="polite"></div><div class="spacer"></div><div id="bus-info" class="muted"></div></div>
</footer>
<dialog id="conn-dialog" aria-labelledby="conn-dialog-title"><h2 id="conn-dialog-title">Connect</h2><div id="conn-dialog-body"></div></dialog>
<dialog id="modal"><form method="dialog"><p id="modal-text"></p><div id="modal-extra"></div><menu id="modal-buttons"></menu></form></dialog>
<script src="uplot/uPlot.iife.min.js"></script>
<script src="icons.js"></script>
<script src="app.js"></script>
<script src="shell.js"></script>
<script src="tree.js"></script>
<script src="node.js"></script>
<script src="connection.js"></script>
<script src="jobs.js"></script>
<script src="devices.js"></script>
<script src="commission.js"></script>
<script src="nodes.js"></script>
<script src="identity.js"></script>
<script src="trace.js"></script>
<script src="trace_ids.js"></script>
<script src="transmit.js"></script>
<script src="explain.js"></script>
<script src="sim.js"></script>
<script src="dbcpick.js"></script>
<script src="edspick.js"></script>
<script src="j1939.js"></script>
<script src="rawcan.js"></script>
<script src="bridge.js"></script>
<script src="target.js"></script>
<script src="links.js"></script>
<script src="tracewin.js"></script>
<script src="life.js"></script>
<script src="update.js"></script>
<script src="boot.js"></script>
</body>
</html>
