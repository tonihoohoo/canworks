<!doctype html>
<html lang="en" data-theme="{{THEME}}">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="canopen-token" content="{{TOKEN}}">
<title>canworks configurator</title>
<link rel="stylesheet" href="uplot/uPlot.min.css">
<link rel="stylesheet" href="style.css">
</head>
<body>
<header id="top">
  <h1>canworks configurator</h1>
  <span id="mode" class="badge" hidden></span>
  <div class="spacer"></div>
  <div id="theme" class="segmented" role="group" aria-label="Theme">
    <button type="button" data-theme-choice="light">Light</button><button type="button" data-theme-choice="dark">Dark</button><button type="button" data-theme-choice="auto">Auto</button>
  </div>
  <div id="actions" hidden>
    <button id="btn-reload" type="button" data-config="1">Reload from disk</button>
    <button id="btn-close" type="button">Close</button>
    <details id="menu-project" class="menu" hidden>
      <summary aria-haspopup="menu">Project</summary>
      <div role="menu" aria-label="Project">
        <button id="btn-move" type="button" class="item" role="menuitem">Move into project…</button>
        <button id="btn-new-project" type="button" class="item" role="menuitem" title="Create an OpenPLC Editor project with this config and its I/O declared in the program main">New editor project…</button>
      </div>
    </details>
    <details id="menu-export" class="menu" data-config="1">
      <summary aria-haspopup="true">Export</summary>
      <div class="menu-panel" role="group" aria-label="Export">
        <button id="btn-export-all" type="button" class="item" title="Every node as a CiA 306 DCF file, checked, in one zip">All DCFs</button>
        <button id="btn-export-node" type="button" class="item" title="The open node as a CiA 306 DCF file, checked">This node's DCF</button>
        <div class="menu-row"><select id="dbc-sdo" aria-label="SDO frames in the DBC file" title="SDO frames in the DBC file">
          <option value="none">No SDO frames</option><option value="config">SDO: configured objects</option><option value="all">SDO: all EDS objects</option>
        </select><button id="btn-export-dbc" type="button" class="item" title="The network as a DBC file for CAN bus tools (PDOs, heartbeat, EMCY, NMT, SYNC)">DBC</button></div>
        <button id="btn-export-html" type="button" class="item" title="One HTML document of every network for people: topology, COB-ID map, bus load, nodes, PDO layouts, boot SDO writes and PLC I/O">Documentation</button>
      </div>
    </details>
    <button id="btn-save" type="button" class="primary" data-config="1">Save</button>
  </div>
</header>
<div id="sim-banner" role="note" hidden></div>
<div id="banner" role="status" hidden><span id="banner-text"></span><button id="banner-close" type="button" title="Close" aria-label="Close message">✕</button></div>
<main id="start" hidden>
  <section class="start-choices">
    <button id="start-project" type="button" class="choice"><strong>Open editor project</strong><span>Edit the project's canworks/ folder. Addresses are checked against the rest of the project.</span></button>
    <button id="start-standalone" type="button" class="choice"><strong>Open standalone config</strong><span>A folder with canworks.json and its EDS files, before a project exists.</span></button>
    <button id="start-new" type="button" class="choice"><strong>New standalone config</strong><span>Start an empty config in a folder; it is created when you first save.</span></button>
    <button id="start-commission" type="button" class="choice"><strong>Commission a device</strong><span>A USB CAN adapter on this PC, no PLC and no config: scan, LSS, object dictionary, parameter backup, trace.</span></button>
  </section>
  <section class="browser">
    <h2 id="browser-title">Choose a folder</h2>
    <div class="row">
      <button id="browser-up" type="button" title="Parent folder" aria-label="Parent folder">↑</button>
      <input id="browser-path" type="text" spellcheck="false" aria-label="Folder path">
      <button id="browser-go" type="button">Go</button>
      <button id="browser-open" type="button" class="primary">Open this folder</button>
    </div>
    <ul id="browser-list" class="folders"></ul>
  </section>
  <section>
    <h2>Recent</h2>
    <ul id="recent" class="folders"></ul>
  </section>
</main>
<main id="editor" hidden>
  <nav id="side" aria-label="Pages">
    <div id="net-bar" data-config="1"></div>
    <button id="nav-bus" type="button" data-view="bus" class="nav-item" data-config="1">Bus and master</button>
    <h2 id="nodes-caption" class="side-caption" data-config="1">Nodes</h2>
    <ul id="node-list" data-config="1"></ul>
    <label class="file-button" data-config="1">Add node from EDS… <input id="eds-input" type="file" accept=".eds,.EDS"></label>
    <button id="nav-gateway" type="button" data-view="gateway" class="nav-item" hidden>Gateway</button>
    <button type="button" data-view="declarations" class="nav-item" data-config="1">Variable declarations</button>
    <h2 class="side-caption">Runtime</h2>
    <button type="button" data-view="online" class="nav-item">Online</button>
    <button id="nav-scan" type="button" data-view="scan" class="nav-item">Scan the bus</button>
    <button type="button" data-view="trace" class="nav-item">Trace</button>
    <button id="nav-simulation" type="button" data-view="simulation" class="nav-item" data-config="1">Simulation</button>
    <button id="nav-machine" type="button" data-view="machine" class="nav-item" data-config="1" hidden>Machine</button>
    <button type="button" data-view="framelab" class="nav-item">Frame lab</button>
    <div id="unused-eds" data-config="1"></div>
    <p id="scan-info" class="muted" data-config="1"></p>
  </nav>
  <section id="view" aria-label="Page"></section>
  <section id="problems" aria-label="Problems"><details id="problems-box" open>
    <summary><h2 class="side-caption">Problems</h2> <span id="problem-count" class="muted" aria-live="polite"></span></summary>
    <div id="overlap-box" hidden><label class="check" title="Save even if a CANopen location overlaps one the editor project uses"><input id="allow-overlap" type="checkbox"> Allow overlap</label>
      <span class="hint">Save even though these locations overlap the editor project, like the deploy tool's --allow-clash.</span></div>
    <ul id="problem-list"></ul>
  </details></section>
</main>
<dialog id="modal"><form method="dialog"><p id="modal-text"></p><div id="modal-extra"></div><menu id="modal-buttons"></menu></form></dialog>
<script src="uplot/uPlot.iife.min.js"></script>
<script src="app.js"></script>
<script src="commission.js"></script>
<script src="trace.js"></script>
<script src="explain.js"></script>
<script src="sim.js"></script>
<script src="j1939.js"></script>
</body>
</html>
