# Keeps the SHA pins of the GitHub Actions and the PC tools' locked
# dependency versions (tools/deploy/uv.lock) current: one grouped pull request
# a month each, plus security updates when an advisory names a locked version
# (lock-dependency-versions). The floors in pyproject.toml are raised by hand.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    groups:
      actions:
        patterns: ["*"]
  - package-ecosystem: uv
    directory: /tools/deploy
    schedule:
      interval: monthly
    groups:
      python:
        patterns: ["*"]
