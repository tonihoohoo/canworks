name: Build the plugin
description: >
  Upstream runtime checkout at the pinned release (plugin headers, stock
  install test; docker/local-runtime/runtime-version), build
  dependencies, Lely CANopen from the cache (or built), the deploy tool in the
  plugin venv (the plugin's EDS lint) and the cmake build in ./build (every
  target, or the ones named in `targets`) through ccache. The compiler cache is
  restored from the newest run with the same targets; `main` runs save one per
  commit and a pull request saves one for itself on its first run (a pull
  request's cache is only visible to that pull request).

inputs:
  kernel-modules:
    description: >
      Install linux-modules-extra (the vcan module). Only the jobs that create
      vcan interfaces need it; it is the slowest package to install.
    default: "true"
  strucpp:
    description: >
      Path of the STruC++ command (scripts/fetch-strucpp.sh). Set: the build
      also compiles the CiA 402 demo program into sim_tests.
    default: ""
  runtime-ref:
    description: >
      The upstream runtime ref to check out. Empty: the pinned release
      (docker/local-runtime/runtime-version), whose archive sha256 is checked.
    default: ""
  targets:
    description: >
      CMake targets to build, space separated. Empty: every target (the plugin,
      the simulator and every test binary).
    default: ""

runs:
  using: composite
  steps:
    - name: The pinned upstream runtime release
      id: runtime
      shell: bash
      env:
        RUNTIME_REF: ${{ inputs.runtime-ref }}
      run: echo "ref=${RUNTIME_REF:-$(cat docker/local-runtime/runtime-version)}" >> "$GITHUB_OUTPUT"

    - name: Check out the upstream OpenPLC runtime (plugin headers, stock install test)
      uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      with:
        repository: Autonomy-Logic/openplc-runtime
        ref: ${{ steps.runtime.outputs.ref }}
        path: upstream-runtime

    - name: The pinned release's archive sha256 (scripts/install-bridge.sh checks it) matches the checkout
      if: inputs.runtime-ref == ''
      shell: bash
      env:
        REF: ${{ steps.runtime.outputs.ref }}
      run: |
        # GitHub's archive of a tag is git archive with the tag's name less a leading v as the folder, gzip -n.
        got=$(git -C upstream-runtime archive --format=tar --prefix="openplc-runtime-${REF#v}/" HEAD | gzip -cn | sha256sum | cut -d' ' -f1)
        want=$(cat docker/local-runtime/runtime-sha256)
        [ "$got" = "$want" ] || { echo "the $REF archive has sha256 $got, docker/local-runtime/runtime-sha256 says $want" >&2; exit 1; }

    - name: Package cache key (runner image, kernel, package set)
      id: apt-key
      shell: bash
      env:
        KERNEL_MODULES: ${{ inputs.kernel-modules }}
      run: echo "key=apt-build-${ImageOS:-os}-${ImageVersion:-image}-$(uname -r)-modules-${KERNEL_MODULES}-${{ hashFiles('.github/actions/build-plugin/action.yml') }}" >> "$GITHUB_OUTPUT"

    - name: Cache the build dependency packages
      uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
      with:
        path: ~/.cache/canworks/apt-build
        key: ${{ steps.apt-key.outputs.key }}

    - name: Install build dependencies
      # Skips what the runner image already has, installs the cached .deb files
      # without the network, and bounds a stalled package mirror with retries
      # (.github/scripts/apt_install.py).
      shell: bash
      env:
        KERNEL_MODULES: ${{ inputs.kernel-modules }}
      run: |
        pkgs="build-essential cmake pkg-config autoconf automake libtool python3-venv can-utils libssl-dev ccache"
        if [ "$KERNEL_MODULES" = true ] && ! modinfo vcan >/dev/null 2>&1; then
          python3 .github/scripts/apt_install.py --debs ~/.cache/canworks/apt-build $pkgs "linux-modules-extra-$(uname -r)" || \
          python3 .github/scripts/apt_install.py --debs ~/.cache/canworks/apt-build $pkgs
        else
          python3 .github/scripts/apt_install.py --debs ~/.cache/canworks/apt-build $pkgs
        fi

    - name: Prepare /opt/canworks
      shell: bash
      run: sudo mkdir -p /opt/canworks && sudo chown "$USER" /opt/canworks

    - name: Cache Lely CANopen
      id: lely-cache
      uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
      with:
        path: /opt/canworks
        key: lely-${{ runner.os }}-${{ hashFiles('scripts/build-lely.sh') }}

    - name: Build Lely CANopen and dcfgen
      if: steps.lely-cache.outputs.cache-hit != 'true'
      shell: bash
      run: scripts/build-lely.sh --prefix /opt/canworks

    - name: Lely's CiA 309-3 text layer is in liblely-co (the plugin's CiA 309-3 gateway)
      shell: bash
      run: |
        for sym in co_gw_txt_create co_gw_txt_send co_gw_txt_recv co_gw_txt_set_send_func co_gw_txt_set_recv_func; do
          nm -D /opt/canworks/lely/lib/liblely-co.so | grep -qw "$sym" || { echo "liblely-co lacks $sym" >&2; exit 1; }
        done

    - name: Vendored Lely dcf package matches the pinned lely-core
      shell: bash
      run: scripts/check-lely-dcf.sh --prefix /opt/canworks

    - name: Install the deploy tool into the plugin venv (the plugin's EDS lint)
      shell: bash
      run: /opt/canworks/venv/bin/python -m pip install -q ./tools/deploy

    - name: Compiler cache key (runner image, compiler, target set; ccache itself hashes each compile's inputs)
      id: ccache-key
      shell: bash
      env:
        STRUCPP: ${{ inputs.strucpp }}
        TARGETS: ${{ inputs.targets }}
        PR: ${{ github.event.pull_request.number }}
      run: |
        set_id=$(printf '%s|%s' "${TARGETS:-all}" "${STRUCPP:+strucpp}" | sha1sum | cut -c1-8)
        prefix="ccache-${ImageOS:-os}-${ImageVersion:-image}-gcc$(gcc -dumpfullversion)-${set_id}-"
        echo "prefix=$prefix" >> "$GITHUB_OUTPUT"
        if [ -n "$PR" ]; then echo "key=${prefix}pr${PR}" >> "$GITHUB_OUTPUT"; else echo "key=${prefix}${GITHUB_SHA}" >> "$GITHUB_OUTPUT"; fi

    - name: Restore the compiler cache (this pull request's, else the newest with this key prefix)
      id: ccache
      uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
      with:
        path: ~/.cache/canworks/ccache
        key: ${{ steps.ccache-key.outputs.key }}
        restore-keys: ${{ steps.ccache-key.outputs.prefix }}

    - name: Build
      shell: bash
      env:
        STRUCPP: ${{ inputs.strucpp }}
        TARGETS: ${{ inputs.targets }}
        CCACHE_BASEDIR: ${{ github.workspace }}
        CCACHE_NOHASHDIR: "true"
        CCACHE_COMPILERCHECK: content
        CCACHE_MAXSIZE: 300M
      run: |
        export CCACHE_DIR="$HOME/.cache/canworks/ccache"
        ccache -z >/dev/null
        cmake -B build -DOPENPLC_ROOT="$PWD/upstream-runtime" ${STRUCPP:+-DSTRUCPP="$STRUCPP"} \
          -DCMAKE_C_COMPILER_LAUNCHER=ccache -DCMAKE_CXX_COMPILER_LAUNCHER=ccache
        cmake --build build -j"$(nproc)" ${TARGETS:+--target $TARGETS}
        ccache -s

    - name: Save the compiler cache (each main commit; a pull request once)
      if: steps.ccache.outputs.cache-hit != 'true' && (github.event_name == 'pull_request' || github.ref == 'refs/heads/main')
      uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
      with:
        path: ~/.cache/canworks/ccache
        key: ${{ steps.ccache-key.outputs.key }}
