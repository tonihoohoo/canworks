name: Integration (upstream runtime, Docker)

# End-to-end installs against things outside this repository: the stock
# runtime install against upstream `development`, and the managed Docker route
# against the published runtime image. They are slow and mostly catch upstream
# drift, so pull requests run them only when they touch the install routes;
# otherwise they run weekly, by hand ("Run workflow"), or locally (README,
# "Integration tests"). CI's ci-ok check does not wait for them.
on:
  pull_request:
    paths:
      - "scripts/install-stock.sh"
      - "scripts/docker_spec.py"
      - "scripts/build-lely.sh"
      - "test/stock/**"
      - "test/docker/**"
      - "tools/editor-hook/**"
      - ".github/actions/build-plugin/**"
      - ".github/workflows/integration.yml"
  schedule:
    - cron: "17 4 * * 1"  # Mondays 04:17 UTC
  workflow_dispatch:

concurrency:
  group: integration-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  stock:
    # Stock runtime install, upload rules and editor hook against upstream development.
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: ./.github/actions/build-plugin
        with:
          kernel-modules: "false"
          runtime-ref: development  # upstream drift; the other builds use the pinned release

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Install the stock test's Python dependencies
        # python-dotenv: the upstream runtime's webserver config, imported by test/stock.
        run: python -m pip install -q jsonschema python-dotenv

      - name: Stock runtime install, upload rules and editor hook (upstream development)
        run: test/stock/run.sh upstream-runtime build

  docker:
    # The managed Docker install route (canopen-docker-install) against the
    # published runtime image.
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Create vcan0
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq "linux-modules-extra-$(uname -r)" || true
          sudo modprobe vcan
          sudo ip link add dev vcan0 type vcan
          sudo ip link set vcan0 up

      - name: Build in the runtime image, ping-pong and the runtime container
        run: sudo test/docker/run.sh --image ghcr.io/autonomy-logic/openplc-runtime:latest

  single-protocol:
    # The plugin built with one protocol only (CANWORKS_WITH_CANOPEN /
    # CANWORKS_WITH_J1939, install-stock.sh --without-*): weekly and by hand;
    # CI builds both protocols together.
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        protocol: [canopen, j1939]
    name: single-protocol (${{ matrix.protocol }})
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: The pinned upstream runtime release
        if: matrix.protocol == 'j1939'
        id: runtime
        run: echo "ref=$(cat docker/local-runtime/runtime-version)" >> "$GITHUB_OUTPUT"

      - name: Check out the upstream OpenPLC runtime (plugin headers)
        if: matrix.protocol == 'j1939'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: Autonomy-Logic/openplc-runtime
          ref: ${{ steps.runtime.outputs.ref }}
          path: upstream-runtime

      - name: J1939 only (no Lely, no dcfgen)
        if: matrix.protocol == 'j1939'
        run: |
          cmake -B build -DOPENPLC_ROOT="$PWD/upstream-runtime" -DCANWORKS_WITH_CANOPEN=OFF
          cmake --build build -j"$(nproc)"
          ctest --test-dir build --output-on-failure
          if ldd build/plugins/libcanworks_plugin.so | grep -i lely; then
            echo "::error::the J1939-only plugin links Lely"; exit 1
          fi

      - uses: ./.github/actions/build-plugin
        if: matrix.protocol == 'canopen'
        with:
          kernel-modules: "false"
          targets: canworks_plugin

      - name: CANopen only
        if: matrix.protocol == 'canopen'
        run: |
          cmake -B build-canopen -DOPENPLC_ROOT="$PWD/upstream-runtime" -DCANWORKS_WITH_J1939=OFF
          cmake --build build-canopen -j"$(nproc)"
          CANWORKS_EDSLINT=python3 PYTHONPATH="$PWD/tools/deploy" ctest --test-dir build-canopen --output-on-failure -j4
          # A J1939 config is refused by name.
          if build-canopen/canopen_check --no-dcfgen examples/j1939/canworks.json; then
            echo "::error::the CANopen-only build accepted a J1939 config"; exit 1
          fi
