name: Release PC tools

# Publishes the PC tools as one wheel on a GitHub release deploy-v<version>
# (canopen-pc-install). Normally automatic: when CI and PC tools finish on a
# main commit whose package version has no release yet and both passed (PC
# tools may also not have run), the tag and release are created on that
# commit. A hand-pushed deploy-v<version> tag still releases (it must match
# the package version), and "Run workflow" releases the current main.
# Tags made here with GITHUB_TOKEN start no other workflow, so an automatic
# release never re-triggers itself through the tag trigger.
#
# Each release also publishes the Modbus bridge image (modbus-bridge)
# ghcr.io/<owner>/canworks-bridge, which the local runtime runs next to
# upstream's runtime image (canopen-local-runtime): the jobs image (amd64 and
# arm64 on native runners, pushed by digest) and manifest (:<version> and
# :latest) run only when the release job released (go=true), and an existing
# :<version> is never overwritten. The image build itself is checked on pull
# requests by bridge-image.yml and local-runtime.yml (build without push).
#
# The notes come from tools/deploy/release-notes.md plus "What's new": each PR
# merged since the previous release with its "After:" paragraph
# (scripts/release_notes.py), checked for banned words before anything is
# published. After a release and its images are out, the prune job keeps the
# newest 4 deploy-v releases and deletes older ones with their tags; it only
# lists them until the repository variable RELEASE_PRUNE is "on". "Run
# workflow" with prune_only runs just that job.
on:
  push:
    tags: ["deploy-v*"]
  workflow_run:
    workflows: ["CI", "PC tools (Windows, macOS, Linux)"]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      prune_only:
        description: "Only remove old releases (lists them unless RELEASE_PRUNE is on)"
        type: boolean
        default: false

# Read-only by default; each job asks for what it needs.
permissions:
  contents: read

# The two workflow_run triggers of one commit arrive close together: run them
# one after the other so only one can create the release.
concurrency:
  group: release-deploy
  cancel-in-progress: false

jobs:
  release:
    # workflow_run: only main pushes that passed. A failed CI or PC tools run
    # also arrives as the other workflow's success, and is refused below.
    if: >-
      github.event_name == 'push' ||
      (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && !inputs.prune_only) ||
      (github.event_name == 'workflow_run' && github.event.workflow_run.event == 'push' &&
       github.event.workflow_run.conclusion == 'success')
    runs-on: ubuntu-24.04
    permissions:
      contents: write  # the tag, the release and its files
      actions: read    # the CI and PC tools runs of the commit
    outputs:
      go: ${{ steps.gate.outputs.go }}
      version: ${{ steps.version.outputs.version }}
      sha: ${{ steps.version.outputs.sha }}
    env:
      GH_TOKEN: ${{ github.token }}
      SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.SHA }}
          fetch-depth: 0

      - name: Version to release
        id: version
        run: |
          if [ "$GITHUB_EVENT_NAME" = push ]; then
            version=$(python3 scripts/release_version.py "$GITHUB_REF_NAME")
          else
            version=$(python3 scripts/release_version.py --package)
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=deploy-v$version" >> "$GITHUB_OUTPUT"
          echo "sha=$SHA" >> "$GITHUB_OUTPUT"

      - name: Decide whether this commit is released now
        id: gate
        env:
          TAG: ${{ steps.version.outputs.tag }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          go() { echo "go=$1" >> "$GITHUB_OUTPUT"; }
          if [ "$GITHUB_EVENT_NAME" = push ]; then go true; exit 0; fi

          if gh release view "$TAG" --json assets --jq '.assets[].name' > assets.txt 2>/dev/null; then
            if grep -qx "canworks-$VERSION-py3-none-any.whl" assets.txt; then
              echo "::notice::$TAG is already released; nothing to do"
              go false; exit 0
            fi
            echo "::error::release $TAG exists without its wheel; fix it by hand (upload the wheel or delete the release)"
            exit 1
          fi
          if git rev-parse -q --verify "refs/tags/$TAG" > /dev/null; then
            echo "::notice::tag $TAG exists (pushed by hand?); its own run publishes the release"
            go false; exit 0
          fi

          main_version=$(git show origin/main:tools/deploy/pyproject.toml | sed -n 's/^version *= *"\(.*\)"/\1/p')
          if python3 scripts/release_version.py --superseded "$VERSION" "$main_version"; then
            echo "::notice::main is at $main_version already; $VERSION is skipped"
            go false; exit 0
          fi

          # The repository-wide runs list: the per-workflow one (gh run list
          # --workflow) now and then answers [] for a run that exists, which
          # refused releases whose checks had passed.
          gh api "repos/$GITHUB_REPOSITORY/actions/runs?head_sha=$SHA&event=push&per_page=100" > runs.json
          for wf in ci pc-tools; do
            jq "[.workflow_runs[] | select(.path == \".github/workflows/$wf.yml\") | {status, conclusion}]" runs.json > "$wf.json"
          done
          mv pc-tools.json pc.json
          decision=$(python3 scripts/release_version.py --decide ci.json pc.json)
          echo "CI: $(cat ci.json)  PC tools: $(cat pc.json)  -> $decision"
          case "$decision" in
            release) go true ;;
            wait) echo "::notice::a check on $SHA is still running; its completion releases $TAG"; go false ;;
            *) echo "::notice::a check on $SHA did not pass (or CI did not run); $TAG is not released from it"; go false ;;
          esac

      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        if: steps.gate.outputs.go == 'true'

      - name: Build the wheel
        if: steps.gate.outputs.go == 'true'
        run: uv build --wheel --out-dir dist tools/deploy

      - name: The locked dependency versions (canworks-<version>-constraints.txt, the installers' --constraints)
        if: steps.gate.outputs.go == 'true'
        run: |
          out="dist/canworks-${{ steps.version.outputs.version }}-constraints.txt"
          uv export --project tools/deploy --frozen --no-hashes --no-emit-project --no-dev \
            --format requirements-txt -q -o "$out"
          grep -q '^cantools==' "$out"
          ! grep -q '^canworks' "$out"

      - name: Exactly one platform-independent wheel
        if: steps.gate.outputs.go == 'true'
        run: |
          ls dist
          test "$(ls dist/*.whl | wc -l)" -eq 1
          test -f "dist/canworks-${{ steps.version.outputs.version }}-py3-none-any.whl"

      - name: The SDO block library (canworks.stlib, from the wheel, with its version)
        if: steps.gate.outputs.go == 'true'
        run: |
          python3 -m zipfile -e dist/*.whl wheel
          PYTHONPATH=wheel python3 -m canworks library --out dist
          ls dist

      - name: Create the release
        if: steps.gate.outputs.go == 'true'
        env:
          TAG: ${{ steps.version.outputs.tag }}
          VERSION: ${{ steps.version.outputs.version }}
          BANNED_WORDS: ${{ secrets.BANNED_WORDS }}
        run: |
          previous=$(git tag --list 'deploy-v*' | python3 scripts/release_version.py --previous-tag "$VERSION")
          python3 scripts/release_notes.py --version "$VERSION" --repo "$GITHUB_REPOSITORY" --sha "$SHA" \
            ${previous:+--previous "$previous"} --out notes.md
          # The install scripts too: the documented one-line installers fetch
          # them from releases/latest/download/, so users run released code.
          cp scripts/install-pc.sh scripts/install-pc.ps1 \
             scripts/install-bridge.sh scripts/install-bridge.ps1 tools/deploy/canworks/devices/device-probe.sh dist/
          gh release create "$TAG" dist/*.whl dist/canworks.stlib dist/canworks-$VERSION-constraints.txt \
            dist/install-pc.sh dist/install-pc.ps1 \
            dist/install-bridge.sh dist/install-bridge.ps1 dist/device-probe.sh \
            --target "$SHA" \
            --title "PC tools $VERSION" \
            --notes-file notes.md

  image:
    needs: release
    if: needs.release.outputs.go == 'true'
    strategy:
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      packages: write
    env:
      VERSION: ${{ needs.release.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.release.outputs.sha }}

      - uses: ./.github/actions/locked-versions

      - name: Log in to GHCR
        run: echo "${{ github.token }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin

      - name: Build and push the Modbus bridge image by digest
        run: |
          repo="ghcr.io/$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')/canworks-bridge"
          docker build -f docker/bridge/Dockerfile --build-arg TOOLS_VERSION="$VERSION" \
            -t "$repo:build-${{ matrix.arch }}" .
          docker run --rm --entrypoint ldd "$repo:build-${{ matrix.arch }}" /opt/canworks/bin/canworks-bridge > ldd.txt
          if grep "not found" ldd.txt; then exit 1; fi
          docker run --rm "$repo:build-${{ matrix.arch }}" --version
          docker push "$repo:build-${{ matrix.arch }}"
          digest=$(docker image inspect "$repo:build-${{ matrix.arch }}" --format '{{index .RepoDigests 0}}' | cut -d@ -f2)
          echo "bridge=$digest" | tee "digest-${{ matrix.arch }}.txt"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: digest-${{ matrix.arch }}
          path: digest-${{ matrix.arch }}.txt
          retention-days: 1

  manifest:
    needs: [release, image]
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    env:
      VERSION: ${{ needs.release.outputs.version }}
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: digest-*
          merge-multiple: true

      - name: Log in to GHCR
        run: echo "${{ github.token }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin

      - name: Create the Modbus bridge image's :<version> and :latest
        run: |
          repo="ghcr.io/$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')/canworks-bridge"
          if docker manifest inspect "$repo:$VERSION" > /dev/null 2>&1; then
            echo "::error::$repo:$VERSION exists already; a released image is never overwritten"
            exit 1
          fi
          amd64=$(sed -n 's/^bridge=//p' digest-amd64.txt)
          arm64=$(sed -n 's/^bridge=//p' digest-arm64.txt)
          docker buildx imagetools create -t "$repo:$VERSION" -t "$repo:latest" \
            "$repo@$amd64" "$repo@$arm64"
          docker buildx imagetools inspect "$repo:$VERSION"

  prune:
    # After a complete release (wheel and the bridge image), or alone from "Run
    # workflow" with prune_only. A failed release or image job deletes nothing.
    needs: [release, manifest]
    if: >-
      always() &&
      ((needs.release.outputs.go == 'true' && needs.manifest.result == 'success') ||
       (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && inputs.prune_only))
    runs-on: ubuntu-24.04
    permissions:
      contents: write  # deletes old releases and their tags
    env:
      GH_TOKEN: ${{ github.token }}
      PRUNE: ${{ vars.RELEASE_PRUNE }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          sparse-checkout: scripts

      - name: Releases and tags the retention rule removes
        run: |
          gh api "repos/$GITHUB_REPOSITORY/releases?per_page=100" --paginate \
            --jq '.[] | select(.draft | not) | .tag_name' > releases.txt
          gh api "repos/$GITHUB_REPOSITORY/tags?per_page=100" --paginate --jq '.[].name' > tags.txt
          latest=$(gh api "repos/$GITHUB_REPOSITORY/releases/latest" --jq .tag_name 2>/dev/null || true)
          python3 scripts/release_version.py --prune releases.txt tags.txt \
            | { if [ -n "$latest" ]; then grep -vx "release $latest" || true; else cat; fi; } > prune.txt
          {
            if [ "$PRUNE" = on ]; then echo "### Removing old releases"; else
              echo "### Old releases (not removed: set the repository variable RELEASE_PRUNE to on)"; fi
            echo "Kept: newest 4 deploy-v releases. $(grep -c '^release ' prune.txt || true) releases with their tags and $(grep -c '^tag ' prune.txt || true) tags without a release:"
            sed 's/^/- /' prune.txt
          } | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Delete them
        if: env.PRUNE == 'on'
        run: |
          while read -r kind tag; do
            case "$kind" in
              release) gh release delete "$tag" --cleanup-tag --yes -R "$GITHUB_REPOSITORY" ;;
              tag) gh api -X DELETE "repos/$GITHUB_REPOSITORY/git/refs/tags/$tag" ;;
            esac
            echo "deleted $kind $tag"
          done < prune.txt
