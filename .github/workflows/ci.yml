name: CI

on:
  push:
    branches: [main]
  pull_request:

# A newer commit to a pull request cancels its older run; runs on main never
# cancel each other (grouped by commit).
concurrency:
  group: ci-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  changes:
    # code=false when only documentation and specs changed: the build and
    # test jobs below are then skipped (reported as skipped, not pending).
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      code: ${{ steps.classify.outputs.code }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Classify the changed files
        id: classify
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: python3 .github/scripts/ci_changes.py "$BASE" "$HEAD" >> "$GITHUB_OUTPUT"

  banned-words:
    # Words from a private list must not reach the repository. The list is
    # the BANNED_WORDS secret, so it is not in
    # the repository or the log; without it (pull requests from forks) the
    # check says so and passes. BANNED_WORDS_EXCLUDE (a repository variable)
    # names one path to leave out.
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Files, new commits and the pull request text
        env:
          BANNED_WORDS: ${{ secrets.BANNED_WORDS }}
          EXCLUDE: ${{ vars.BANNED_WORDS_EXCLUDE }}
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_BODY: ${{ github.event.pull_request.body }}
        run: |
          python3 scripts/check-banned-words.py --files --exclude "$EXCLUDE" \
            --range "$BASE..$HEAD" --env-text PR_TITLE --env-text PR_BODY

  spec-check:
    # Runs for every change; the only check when only docs and specs changed.
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Install the OpenSpec CLI
        run: npm install -g --silent @fission-ai/openspec@1.14.0

      - name: Validate every spec and change
        run: openspec validate --all --strict --no-interactive

  plugin:
    # Build, and the C++ unit and simulation tests.
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Cache STruC++ (the editor's ST compiler, for the CiA 402 tests)
        uses: actions/cache@v4
        with:
          path: ~/.cache/openplc-canopen/strucpp
          key: strucpp-${{ runner.os }}-${{ hashFiles('scripts/fetch-strucpp.sh') }}

      - name: Fetch STruC++
        id: strucpp
        run: echo "cli=$(scripts/fetch-strucpp.sh)" >> "$GITHUB_OUTPUT"

      - uses: ./.github/actions/build-plugin
        with:
          kernel-modules: "false"
          strucpp: ${{ steps.strucpp.outputs.cli }}

      - name: Unit and virtual-bus tests (one ctest test per simulation case, run in parallel)
        env:
          CANOPEN_REQUIRE_STRUCPP: "1"
        run: ctest --test-dir build --output-on-failure -j4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: CiA 402 ST tests (the generated axis glue and the demo program against a drive model)
        run: |
          python -m pip install -q jsonschema
          test/cia402/run.sh --strucpp "${{ steps.strucpp.outputs.cli }}"

  vcan:
    # The plugin on vcan, split over three runners (each has its own vcan0) so
    # each runs about the same test time. Test step times (main, 2026-10-07):
    #   group 1: link setup 2 s, ping-pong 16, two networks 21, PLC-cycle SYNC 7,
    #            LSS 11, bus state 10, RTD module 18, parameters 10, fixed PDOs 9,
    #            device commissioning ~25 (new, estimated) = ~130 s
    #   group 2: raw frames and bit rate 53, standalone device simulator 60 = ~115 s
    #   group 3: bus trace 30, slcan 30, master and its own slave 29,
    #            PLC SDO blocks 5, PC-direct commissioning 32 = ~125 s
    # A new vcan test goes into the group with the least time; update the table.
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        group: [1, 2, 3]
    name: vcan (${{ matrix.group }}/3)
    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/build-plugin

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Python dependencies of the vcan scripts (deploy tool modules, diagnostics, trace export)
        run: python -m pip install -q jsonschema cantools python-can pyserial

      - name: Create vcan0 (down; the plugin's link setup brings it up)
        id: vcan
        continue-on-error: true
        run: |
          sudo modprobe vcan
          sudo ip link add dev vcan0 type vcan

      - name: Bring vcan0 up (groups 2 and 3; in group 1 the link setup test leaves it up)
        if: steps.vcan.outcome == 'success' && matrix.group != 1
        run: sudo ip link set vcan0 up

      - name: Link setup on vcan0 (as root, then without CAP_NET_ADMIN)
        if: steps.vcan.outcome == 'success' && matrix.group == 1
        run: |
          sudo build/test/link_check vcan0 --expect ready
          ip link show vcan0 | grep -q ",UP"
          sudo ip link set vcan0 down
          build/test/link_check vcan0 --expect not-permitted
          sudo ip link set vcan0 up

      - name: Ping-pong on vcan0
        if: steps.vcan.outcome == 'success' && matrix.group == 1
        run: |
          test/pingpong/run.sh --seconds 10
          if test/pingpong/run.sh --seconds 4 --no-slave; then
            echo "run.sh passed without the slave" >&2; exit 1
          fi

      - name: Two networks on vcan0 and vcan1 (one master per interface, one lost node)
        if: steps.vcan.outcome == 'success' && matrix.group == 1
        run: |
          sudo ip link add dev vcan1 type vcan
          sudo ip link set vcan1 up
          test/networks/run.sh
          sudo ip link del vcan1

      - name: PLC-cycle SYNC on vcan0
        if: steps.vcan.outcome == 'success' && matrix.group == 1
        run: test/pingpong/run.sh --seconds 6 --plc-cycle

      - name: LSS node ID assignment on vcan0 (slave without a node ID)
        if: steps.vcan.outcome == 'success' && matrix.group == 1
        run: test/lss/run.sh --seconds 10

      - name: Bus trace on vcan0 (capture, directions, filter, formats, idle trace)
        if: steps.vcan.outcome == 'success' && matrix.group == 3
        run: test/trace/run.sh

      - name: Raw frames and bit rate detection on vcan0 and the simulated bus
        if: steps.vcan.outcome == 'success' && matrix.group == 2
        run: test/rawframes/run.sh

      - name: Bus state byte on vcan0 (interface taken down and up)
        if: steps.vcan.outcome == 'success' && matrix.group == 1
        run: test/bus/run.sh

      - name: slcan adapter (fake CANable on a pty, bridged to vcan1)
        if: steps.vcan.outcome == 'success' && matrix.group == 3
        run: test/slcan/run.sh

      - name: RTD temperature module on vcan0
        if: steps.vcan.outcome == 'success' && matrix.group == 1
        run: |
          test/sensor/run.sh --seconds 10
          test/sensor/run.sh --seconds 6 --keep-vendor-pdos

      - name: Device parameter backup, compare and restore on vcan0 (RTD module)
        if: steps.vcan.outcome == 'success' && matrix.group == 1
        run: test/params/run.sh

      - name: Fixed PDO mapping (read-only mapping and COB-IDs) on vcan0
        if: steps.vcan.outcome == 'success' && matrix.group == 1
        run: test/fixed/run.sh

      - name: Write a configuration to one device from the PC on vcan0 (simulated RTD module; then the runtime refusal)
        if: steps.vcan.outcome == 'success' && matrix.group == 1
        run: test/commissioning/run.sh

      - name: The plugin's master and its own slave (vcan0 and vcan1 joined by cangw)
        if: steps.vcan.outcome == 'success' && matrix.group == 3
        run: |
          python3 .github/scripts/apt_install.py can-utils
          sudo modprobe can-gw
          ip link show vcan1 >/dev/null 2>&1 || sudo ip link add dev vcan1 type vcan
          sudo ip link set vcan1 up
          sudo --preserve-env=PATH test/slave/run.sh

      - name: PLC program SDO blocks on vcan0 (a PLC stop cancels a transfer in flight)
        if: steps.vcan.outcome == 'success' && matrix.group == 3
        env:
          CANOPEN_EDSLINT: python3
          PYTHONPATH: tools/deploy
        run: |
          test/plc_sdo/lookup_check.sh build/test/plc_sdo_lookup_check build/plugins/libcanopen_plugin.so \
            build/test/sdo_program.so config/pingpong "$RUNNER_TEMP/plc_sdo_stop" --stop-check

      - name: Standalone device simulator next to the plugin on vcan0 (and real-bus checks on vcan1)
        if: steps.vcan.outcome == 'success' && matrix.group == 2
        run: test/simulator/run.sh

      - name: PC-direct commissioning through a CAN adapter on vcan0 (no runtime; then parity with the plugin)
        if: steps.vcan.outcome == 'success' && matrix.group == 3
        run: test/localbus/run.sh

      - name: Report skipped vcan test
        if: steps.vcan.outcome != 'success'
        run: echo "::warning::vcan is not available on this runner; the ping-pong test was skipped"

  tools:
    # Deploy tool and configurator tests without a browser (the page tests run
    # in configurator-page), with the DCF export compared to the C++ build,
    # split over three runners by test class (.github/scripts/test_shard.py).
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    name: tools (${{ matrix.shard }}/3)
    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/build-plugin
        with:
          kernel-modules: "false"
          targets: canopen_check  # the DCF parity check; the tests use nothing else from the build

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install the deploy tool tests' Python dependencies
        # cantools: loads every exported DBC strictly (test_dbcexport); not a deploy tool dependency.
        # python-can and pyserial: the local adapter backend (localbus); python-can also reads back every
        # exported trace format (test_bustrace).
        run: python -m pip install -q jsonschema cantools python-can pyserial

      - name: Does this shard run the Wireshark decode test (test_bustrace)?
        id: bustrace
        run: |
          if python .github/scripts/test_shard.py --shard ${{ matrix.shard }}/3 --start tools/deploy/tests \
              --top tools/deploy --exclude 'test_configurator_(.*page|layout)$' --contains '\.test_bustrace\..*\.test_wireshark_decodes_canopen$'; then
            echo "here=true" >> "$GITHUB_OUTPUT"
          fi
          echo "image=${ImageOS:-os}-${ImageVersion:-image}" >> "$GITHUB_OUTPUT"

      - name: Cache the tshark packages
        if: steps.bustrace.outputs.here == 'true'
        uses: actions/cache@v4
        with:
          path: ~/.cache/openplc-canopen/apt-tshark
          key: apt-tshark-${{ steps.bustrace.outputs.image }}

      - name: tshark (test_bustrace checks that Wireshark decodes the exported pcapng as CANopen)
        if: steps.bustrace.outputs.here == 'true'
        timeout-minutes: 8
        run: python3 .github/scripts/apt_install.py --debs ~/.cache/openplc-canopen/apt-tshark tshark

      - name: Deploy tool and configurator tests (shared fixtures, bundle, clash check, stub runtime, server, DCF export parity, DBC export)
        env:
          CANOPEN_REQUIRE_PARITY: "1"  # the DCF export is compared with build/canopen_check --dump-writes
          CANOPEN_REQUIRE_TSHARK: ${{ steps.bustrace.outputs.here == 'true' && '1' || '' }}
        run: >
          python .github/scripts/test_shard.py --shard ${{ matrix.shard }}/3
          --start tools/deploy/tests --top tools/deploy --exclude 'test_configurator_(.*page|layout)$'

      - name: Release tag check (deploy-v<version> must match the package version)
        if: matrix.shard == 1
        run: python -m unittest discover -v -s test/pc-tools

      - name: CI change classification, test sharding and banned words
        if: matrix.shard == 1
        run: python -m unittest discover -v -s test/ci

      - name: Editor hook tests (snapshot reading, shared fixtures, child process)
        if: matrix.shard == 2
        run: PYTHONPATH=tools/editor-hook:tools/deploy python -m unittest discover -v -s tools/editor-hook/tests -t tools/editor-hook

      - name: Install-script Docker mode and runtime spec edits (stub docker)
        if: matrix.shard == 3
        # last: runs as root (it may leave root-owned files)
        run: sudo python3 -m unittest discover -v -s test/docker

  configurator-page:
    # The configurator's pages in Chromium, split over three runners by test
    # class. Needs no plugin build.
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    name: configurator-page (${{ matrix.shard }}/3)
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install the page tests' Python dependencies
        run: python -m pip install -q jsonschema playwright python-can pyserial

      - name: Playwright version and runner image (the cache key)
        id: playwright
        run: |
          echo "version=$(python -c 'import importlib.metadata as m; print(m.version("playwright"))')" >> "$GITHUB_OUTPUT"
          echo "image=${ImageOS:-os}-${ImageVersion:-image}" >> "$GITHUB_OUTPUT"

      - name: Cache Chromium
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/ms-playwright
            ~/.cache/openplc-canopen/apt-playwright
          key: playwright-${{ steps.playwright.outputs.image }}-${{ steps.playwright.outputs.version }}

      - name: Chromium for the configurator page tests
        # The browser from the cache (or downloaded); its system libraries through
        # the bounded install, which skips the ones the runner already has.
        timeout-minutes: 8
        run: |
          python -m playwright install chromium
          # --dry-run prints "All system dependencies are installed.", or the missing
          # packages one per indented line (exit 1); older Playwright printed the
          # apt-get command instead.
          plan=$(python -m playwright install-deps --dry-run chromium 2>&1) || true
          echo "$plan"
          if grep -q "dependencies are installed" <<<"$plan"; then exit 0; fi
          deps=$({ sed -n 's/.*--no-install-recommends //p' <<<"$plan" | tr -d '"'
                   sed -n 's/^  \([a-z0-9][^ ]*\)$/\1/p' <<<"$plan"; } | xargs)
          test -n "$deps" || { echo "no package list from playwright install-deps --dry-run" >&2; exit 1; }
          python3 .github/scripts/apt_install.py --debs ~/.cache/openplc-canopen/apt-playwright --no-install-recommends $deps

      - name: Configurator page and layout tests
        env:
          CANOPEN_REQUIRE_BROWSER: "1"  # fail instead of skipping without Playwright/Chromium
        run: >
          python .github/scripts/test_shard.py --shard ${{ matrix.shard }}/3
          --start tools/deploy/tests --top tools/deploy
          --pattern 'test_configurator_*page.py' --pattern 'test_configurator_layout.py'

  ci-ok:
    # The one check a branch ruleset needs: green when every job above passed
    # or was skipped on purpose (documentation-only changes), red otherwise.
    # Job names inside it can change without touching the ruleset.
    if: always()
    needs: [changes, banned-words, spec-check, plugin, vcan, tools, configurator-page]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Every CI job passed or was skipped
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          echo "$RESULTS" | python3 -c '
          import json, sys
          bad = {k: v["result"] for k, v in json.load(sys.stdin).items() if v["result"] not in ("success", "skipped")}
          for k, r in bad.items():
              print(f"::error::{k}: {r}")
          sys.exit(1 if bad else 0)'
