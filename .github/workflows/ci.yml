name: CI

on:
  push:
    branches: [main]
  pull_request:

# A newer commit to a pull request cancels its older run; runs on main never
# cancel each other (grouped by commit).
concurrency:
  group: ci-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  changes:
    # code=false when only documentation and specs changed: the build and
    # test jobs below are then skipped (reported as skipped, not pending).
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      code: ${{ steps.classify.outputs.code }}
      # The protocol areas (.github/ci/areas.txt): true when the area's own
      # or shared code changed.
      canopen: ${{ steps.classify.outputs.canopen }}
      j1939: ${{ steps.classify.outputs.j1939 }}
      # The configurator page tests' paths (.github/ci/ui-paths.txt) changed;
      # always true on main.
      ui: ${{ steps.classify.outputs.ui }}
      # The PLCopen export's paths (.github/ci/plcopen-paths.txt) changed:
      # the tools shard runs the truST import check; always true on main.
      plcopen: ${{ steps.classify.outputs.plcopen }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Classify the changed files
        id: classify
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
          MAIN_PUSH: ${{ github.event_name == 'push' && '--main-push' || '' }}
        run: python3 .github/scripts/ci_changes.py $MAIN_PUSH "$BASE" "$HEAD" >> "$GITHUB_OUTPUT"

      - name: Did the tools' dependencies or their lock change?
        id: lock
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          # An unknown base (new branch, force push) checks the lock too.
          if ! changed=$(git diff --name-only "$BASE" "$HEAD" 2>/dev/null) ||
              echo "$changed" | grep -Eqx 'tools/deploy/(pyproject\.toml|uv\.lock)'; then
            echo "check=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        if: steps.lock.outputs.check == 'true'

      - name: tools/deploy/uv.lock matches pyproject.toml (lock-dependency-versions; uv lock updates it)
        if: steps.lock.outputs.check == 'true'
        run: python3 scripts/check-lock.py

  banned-words:
    # Words from a private list must not reach the repository. The list is
    # the BANNED_WORDS secret, so it is not in
    # the repository or the log; without it (pull requests from forks) the
    # check says so and passes. BANNED_WORDS_EXCLUDE (a repository variable)
    # names one path to leave out.
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Files, new commits and the pull request text
        env:
          BANNED_WORDS: ${{ secrets.BANNED_WORDS }}
          EXCLUDE: ${{ vars.BANNED_WORDS_EXCLUDE }}
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_BODY: ${{ github.event.pull_request.body }}
        run: |
          python3 scripts/check-banned-words.py --files --exclude "$EXCLUDE" \
            --range "$BASE..$HEAD" --env-text PR_TITLE --env-text PR_BODY

  spec-check:
    # Runs for every change; the only check when only docs and specs changed.
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install the OpenSpec CLI
        run: npm install -g --silent @fission-ai/openspec@1.14.0

      - name: Validate every spec and change
        run: openspec validate --all --strict --no-interactive

      - name: The tour's labels are on the configurator page (docs/tour.md; Python only, no dependencies)
        run: python3 tools/deploy/tests/test_tour_labels.py

      - name: README.md has no dead links, commands, options or page labels (Python only, no dependencies)
        run: python3 tools/deploy/tests/test_readme.py

  engine:
    # Build, and the C++ unit and simulation tests.
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22

      - name: Cache STruC++ (the editor's ST compiler, for the ST helper and PLC link tests)
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/canworks/strucpp
          key: strucpp-${{ runner.os }}-${{ hashFiles('scripts/fetch-strucpp.sh') }}

      - name: Fetch STruC++
        id: strucpp
        run: echo "cli=$(scripts/fetch-strucpp.sh)" >> "$GITHUB_OUTPUT"

      - uses: ./.github/actions/build-engine
        with:
          kernel-modules: "false"

      - name: Unit and virtual-bus tests (one ctest test per simulation case, run in parallel)
        # Eight at a time on the four cores: the cases mostly wait on bus and timer
        # time (the CPU stays about a quarter busy at -j4), so -j8 halves the step.
        run: ctest --test-dir build --output-on-failure -j8

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"

      - name: OpenPLC Modbus ST tests (the PLC link blocks and canworks_in/canworks_out against a bridge model, ~15 s)
        run: test/plc_modbus/run.sh --strucpp "${{ steps.strucpp.outputs.cli }}"

      - name: The pinned upstream runtime release
        id: runtime
        run: echo "ref=$(cat docker/local-runtime/runtime-version)" >> "$GITHUB_OUTPUT"

      - name: Check out the upstream OpenPLC runtime (its Modbus master plugin)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: Autonomy-Logic/openplc-runtime
          ref: ${{ steps.runtime.outputs.ref }}
          path: upstream-runtime

      - name: OpenPLC through Modbus (the pinned runtime's own Modbus master against the bridge, ~10 s)
        run: |
          python -m pip install -q "$(grep '^pymodbus' upstream-runtime/core/src/drivers/plugins/python/modbus_master/requirements.txt)"
          test/openplc_modbus/run.py --bridge build/bin/canworks-bridge --runtime upstream-runtime

  vcan:
    # The engine on vcan, split over three runners (each has its own vcan0) so
    # each runs about the same test time. Test step times (pull request #69, 2026-10-10):
    #   group 1: link setup 2 s, ping-pong 16, two networks 21,
    #            LSS 12, bus state 9, RTD module 19, device commissioning 33 = ~113 s
    #   group 2: raw frames 21, standalone device simulator 42,
    #            J1939 ECU against the simulator 15, parameters 9, fixed PDOs 9 = ~97 s
    #   group 3: bus trace 31, slcan 31, master and its own slave 28,
    #            PC-direct commissioning 30 = ~120 s
    # A new vcan test goes into the group with the least time; update the table.
    # The CANopen steps run when needs.changes.outputs.canopen is true, the J1939
    # step when .j1939 is; a group with nothing to run skips its build.
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        group: [1, 2, 3]
    name: vcan (${{ matrix.group }}/3)
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: ./.github/actions/build-engine
        if: (needs.changes.outputs.canopen == 'true' || (matrix.group == 2 && needs.changes.outputs.j1939 == 'true'))
        with:
          # what the vcan steps start: the bridge, the CANopen simulator and the helper programs
          # (not unit_tests, sim_tests, sim_unit_tests or slave_tests, which run in the engine job)
          targets: >-
            canworks-bridge canworks-canopen-sim canopen_check canopen_host pingpong_slave lss_slave
            sensor_slave link_check j1939_long_ids

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        if: (needs.changes.outputs.canopen == 'true' || (matrix.group == 2 && needs.changes.outputs.j1939 == 'true'))
        with:
          python-version: "3.11"

      - name: Python dependencies of the vcan scripts (deploy tool modules, diagnostics, trace export, J1939 simulator)
        if: (needs.changes.outputs.canopen == 'true' || (matrix.group == 2 && needs.changes.outputs.j1939 == 'true'))
        run: python -m pip install -q jsonschema cantools python-can pyserial ${{ matrix.group == 2 && 'can-j1939' || '' }}

      - name: Create vcan0 (down; the engine's link setup brings it up)
        if: (needs.changes.outputs.canopen == 'true' || (matrix.group == 2 && needs.changes.outputs.j1939 == 'true'))
        id: vcan
        continue-on-error: true
        run: |
          sudo modprobe vcan
          sudo ip link add dev vcan0 type vcan

      - name: Bring vcan0 up (groups 2 and 3; in group 1 the link setup test leaves it up)
        if: steps.vcan.outcome == 'success' && matrix.group != 1
        run: sudo ip link set vcan0 up

      - name: Link setup on vcan0 (as root, then without CAP_NET_ADMIN)
        if: steps.vcan.outcome == 'success' && matrix.group == 1 && needs.changes.outputs.canopen == 'true'
        run: |
          sudo build/test/link_check vcan0 --expect ready
          ip link show vcan0 | grep -q ",UP"
          sudo ip link set vcan0 down
          build/test/link_check vcan0 --expect not-permitted
          sudo ip link set vcan0 up

      - name: Ping-pong on vcan0
        if: steps.vcan.outcome == 'success' && matrix.group == 1 && needs.changes.outputs.canopen == 'true'
        run: |
          test/pingpong/run.sh --seconds 10
          if test/pingpong/run.sh --seconds 4 --no-slave; then
            echo "run.sh passed without the slave" >&2; exit 1
          fi

      - name: Two networks on vcan0 and vcan1 (one master per interface, one lost node)
        if: steps.vcan.outcome == 'success' && matrix.group == 1 && needs.changes.outputs.canopen == 'true'
        run: |
          sudo ip link add dev vcan1 type vcan
          sudo ip link set vcan1 up
          test/networks/run.sh
          sudo ip link del vcan1

      - name: LSS node ID assignment on vcan0 (slave without a node ID)
        if: steps.vcan.outcome == 'success' && matrix.group == 1 && needs.changes.outputs.canopen == 'true'
        run: test/lss/run.sh --seconds 10

      - name: Bus trace on vcan0 (capture, directions, filter, formats, idle trace)
        if: steps.vcan.outcome == 'success' && matrix.group == 3 && needs.changes.outputs.canopen == 'true'
        run: test/trace/run.sh

      - name: Raw frames on vcan0 and the simulated bus
        if: steps.vcan.outcome == 'success' && matrix.group == 2 && needs.changes.outputs.canopen == 'true'
        run: test/rawframes/run.sh

      - name: Bus state byte on vcan0 (interface taken down and up)
        if: steps.vcan.outcome == 'success' && matrix.group == 1 && needs.changes.outputs.canopen == 'true'
        run: test/bus/run.sh

      - name: slcan adapter (fake CANable on a pty, bridged to vcan1)
        if: steps.vcan.outcome == 'success' && matrix.group == 3 && needs.changes.outputs.canopen == 'true'
        run: test/slcan/run.sh

      - name: RTD temperature module on vcan0
        if: steps.vcan.outcome == 'success' && matrix.group == 1 && needs.changes.outputs.canopen == 'true'
        run: |
          test/sensor/run.sh --seconds 10
          test/sensor/run.sh --seconds 6 --keep-vendor-pdos

      - name: Device parameter backup, compare and restore on vcan0 (RTD module)
        if: steps.vcan.outcome == 'success' && matrix.group == 2 && needs.changes.outputs.canopen == 'true'
        run: test/params/run.sh

      - name: Fixed PDO mapping (read-only mapping and COB-IDs) on vcan0
        if: steps.vcan.outcome == 'success' && matrix.group == 2 && needs.changes.outputs.canopen == 'true'
        run: test/fixed/run.sh

      - name: Write a configuration to one device from the PC on vcan0 (simulated RTD module; then the runtime refusal)
        if: steps.vcan.outcome == 'success' && matrix.group == 1 && needs.changes.outputs.canopen == 'true'
        run: test/commissioning/run.sh

      - name: The engine's master and its own slave (vcan0 and vcan1 joined by cangw)
        if: steps.vcan.outcome == 'success' && matrix.group == 3 && needs.changes.outputs.canopen == 'true'
        run: |
          python3 .github/scripts/apt_install.py can-utils
          sudo modprobe can-gw
          ip link show vcan1 >/dev/null 2>&1 || sudo ip link add dev vcan1 type vcan
          sudo ip link set vcan1 up
          sudo --preserve-env=PATH test/slave/run.sh

      - name: Standalone device simulator next to the engine on vcan0 (and real-bus checks on vcan1)
        if: steps.vcan.outcome == 'success' && matrix.group == 2 && needs.changes.outputs.canopen == 'true'
        run: test/simulator/run.sh

      - name: PC-direct commissioning through a CAN adapter on vcan0 (no bridge; then parity with the engine)
        if: steps.vcan.outcome == 'success' && matrix.group == 3 && needs.changes.outputs.canopen == 'true'
        run: test/localbus/run.sh

      - name: J1939 ECU against the J1939 simulator on vcan0 (claim, values both ways, requests, timeout bit, interface down and up)
        if: steps.vcan.outcome == 'success' && matrix.group == 2 && needs.changes.outputs.j1939 == 'true'
        run: |
          test/j1939/run.sh
          test/j1939/sim_vcan.sh
          build/test/j1939_long_ids vcan0

      - name: Report skipped vcan test
        if: steps.vcan.outcome == 'failure'
        run: echo "::warning::vcan is not available on this runner; the ping-pong test was skipped"

  tools:
    # Deploy tool and configurator tests without a browser (the page tests run
    # in configurator-page), with the DCF export compared to the C++ build,
    # split over two runners by test class (.github/scripts/test_shard.py), and
    # on each runner over one worker process per CPU (--jobs auto).
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2]
    name: tools (${{ matrix.shard }}/2)
    env:
      # The classes that run build/canopen_check stay on one shard, split by recorded class times
      # (.github/ci/tool-test-times.json; refresh it from the shards' "class times:" lines when they drift).
      SHARD_ARGS: >-
        --start tools/deploy/tests --top tools/deploy --exclude (_page|\.test_configurator_layout)$
        --timings .github/ci/tool-test-times.json --split-over 30
        --together ^tests\.(test_parity\.\w+|test_dcfexport\.Parity|test_project\.IntoProject)$
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: ./.github/actions/locked-versions

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"

      - name: Install the deploy tool tests' Python dependencies
        # cantools: loads every exported DBC strictly (test_dbcexport); not a deploy tool dependency.
        # python-can and pyserial: the local adapter backend (localbus); python-can also reads back every
        # exported trace format (test_bustrace).
        # Before the shard checks: discovery imports the test modules.
        run: python -m pip install -q jsonschema cantools python-can pyserial can-j1939 "iroh>=1.1,<1.2" ifaddr "paramiko>=3.5"

      - name: Does this shard run the parity tests (build/canopen_check)?
        id: parity
        run: |
          set -f  # SHARD_ARGS holds regexes: no globbing
          if python .github/scripts/test_shard.py --shard ${{ matrix.shard }}/2 $SHARD_ARGS \
              --contains '^tests\.(test_parity|test_dcfexport\.Parity|test_project\.IntoProject)\.'; then
            echo "here=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: ./.github/actions/build-engine
        if: steps.parity.outputs.here == 'true'
        with:
          kernel-modules: "false"
          targets: canopen_check  # the DCF and config parity checks; the tests use nothing else from the build

      - name: Does this shard run the Wireshark decode test (test_bustrace)?
        id: bustrace
        run: |
          set -f  # SHARD_ARGS holds regexes: no globbing
          if python .github/scripts/test_shard.py --shard ${{ matrix.shard }}/2 $SHARD_ARGS \
              --contains '\.test_bustrace\..*\.test_wireshark_decodes_canopen$'; then
            echo "here=true" >> "$GITHUB_OUTPUT"
          fi
          echo "image=${ImageOS:-os}-${ImageVersion:-image}" >> "$GITHUB_OUTPUT"

      - name: Cache the tshark packages
        if: steps.bustrace.outputs.here == 'true'
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/canworks/apt-tshark
          key: apt-tshark-${{ steps.bustrace.outputs.image }}

      - name: tshark (test_bustrace checks that Wireshark decodes the exported pcapng as CANopen)
        if: steps.bustrace.outputs.here == 'true'
        timeout-minutes: 8
        run: python3 .github/scripts/apt_install.py --debs ~/.cache/canworks/apt-tshark tshark

      - name: Deploy tool and configurator tests (shared fixtures, bridge files, stub runtime, server, DCF export and config parity, DBC export)
        env:
          # build/canopen_check: --dump-writes against the DCF export, test/fixtures/config/bad against the checks
          CANWORKS_REQUIRE_PARITY: ${{ steps.parity.outputs.here == 'true' && '1' || '' }}
          CANWORKS_REQUIRE_TSHARK: ${{ steps.bustrace.outputs.here == 'true' && '1' || '' }}
        run: |
          set -f  # SHARD_ARGS holds regexes: no globbing
          python .github/scripts/test_shard.py --shard ${{ matrix.shard }}/2 $SHARD_ARGS --jobs auto

      - name: Release tag check (deploy-v<version> must match the package version)
        if: matrix.shard == 1
        run: python -m unittest discover -v -s test/pc-tools

      - name: CI change classification, test sharding and banned words
        if: matrix.shard == 1
        run: python -m unittest discover -v -s test/ci

      - name: Cache the pinned truST release
        if: matrix.shard == 1 && needs.changes.outputs.plcopen == 'true'
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/canworks/trust
          key: trust-${{ runner.os }}-${{ hashFiles('test/plcopen/fetch-trust.sh') }}

      - name: PLCopen export imported and built by truST (the whole library, ~10 s)
        if: matrix.shard == 1 && needs.changes.outputs.plcopen == 'true'
        working-directory: tools/deploy
        run: CANWORKS_TRUST="$("$GITHUB_WORKSPACE/test/plcopen/fetch-trust.sh")" python -m unittest -v tests.test_plcopen.TrustImport

  configurator-page:
    # The configurator's pages in Chromium (every test_*_page.py and the layout
    # test), split over three runners by test class, classes over 30 s cut into
    # parts, and on each runner over one worker process (and browser) per CPU.
    # Needs no engine build. Skipped when nothing the pages use changed
    # (needs.changes.outputs.ui).
    needs: changes
    if: needs.changes.outputs.code == 'true' && needs.changes.outputs.ui == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    name: configurator-page (${{ matrix.shard }}/3)
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: ./.github/actions/locked-versions

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"

      - name: Install the page tests' Python dependencies
        run: python -m pip install -q jsonschema playwright python-can pyserial cantools "paramiko>=3.5"

      - name: Playwright version and runner image (the cache key)
        id: playwright
        run: |
          echo "version=$(python -c 'import importlib.metadata as m; print(m.version("playwright"))')" >> "$GITHUB_OUTPUT"
          echo "image=${ImageOS:-os}-${ImageVersion:-image}" >> "$GITHUB_OUTPUT"

      - name: Cache Chromium
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cache/ms-playwright
            ~/.cache/canworks/apt-playwright
          key: playwright-${{ steps.playwright.outputs.image }}-${{ steps.playwright.outputs.version }}

      - name: Chromium for the configurator page tests
        # The browser from the cache (or downloaded); its system libraries through
        # the bounded install, which skips the ones the runner already has.
        timeout-minutes: 8
        run: |
          python -m playwright install chromium
          # --dry-run prints "All system dependencies are installed.", or the missing
          # packages one per indented line (exit 1); older Playwright printed the
          # apt-get command instead.
          plan=$(python -m playwright install-deps --dry-run chromium 2>&1) || true
          echo "$plan"
          if grep -q "dependencies are installed" <<<"$plan"; then exit 0; fi
          deps=$({ sed -n 's/.*--no-install-recommends //p' <<<"$plan" | tr -d '"'
                   sed -n 's/^  \([a-z0-9][^ ]*\)$/\1/p' <<<"$plan"; } | xargs)
          test -n "$deps" || { echo "no package list from playwright install-deps --dry-run" >&2; exit 1; }
          python3 .github/scripts/apt_install.py --debs ~/.cache/canworks/apt-playwright --no-install-recommends $deps

      - name: Configurator page and layout tests
        # Split by recorded class times (.github/ci/page-test-times.json; a class not in it counts as the
        # median). Each shard prints its "class times:" line; refresh the file from those when shards drift.
        # One Chromium per worker: the tests mostly wait, so 4 workers on 4 CPUs take about 1/2.7 of the time.
        env:
          CANWORKS_REQUIRE_BROWSER: "1"  # fail instead of skipping without Playwright/Chromium
        run: >
          python .github/scripts/test_shard.py --shard ${{ matrix.shard }}/3 --jobs auto
          --start tools/deploy/tests --top tools/deploy --timings .github/ci/page-test-times.json --split-over 30
          --pattern 'test_*_page.py' --pattern 'test_configurator_layout.py'

  ci-ok:
    # The one check a branch ruleset needs: green when every job above passed
    # or was skipped on purpose (documentation-only changes, page tests when
    # nothing the configurator uses changed), red otherwise.
    # Job names inside it can change without touching the ruleset.
    if: always()
    needs: [changes, banned-words, spec-check, engine, vcan, tools, configurator-page]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Every CI job passed or was skipped
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          echo "$RESULTS" | python3 -c '
          import json, sys
          bad = {k: v["result"] for k, v in json.load(sys.stdin).items() if v["result"] not in ("success", "skipped")}
          for k, r in bad.items():
              print(f"::error::{k}: {r}")
          sys.exit(1 if bad else 0)'
