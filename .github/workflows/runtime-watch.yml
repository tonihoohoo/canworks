name: OpenPLC runtime watch

# Upstream's newest OpenPLC runtime and editor releases against the ones
# canworks is tested with, and the files its OpenPLC through Modbus target
# follows at them: the runtime's Modbus master config model, the editor's
# remote device format and its generator of the runtime's config (recorded
# in .github/ci/upstream-watch.json; canopen-ci, Runtime release watch). When
# upstream is newer, one open issue labelled runtime-update says so; a later
# run updates it instead of opening another. Nothing is bumped here: a bump
# needs a check of the changed files and a full CI run.
on:
  schedule:
    - cron: "17 6 3 * *"  # monthly
  workflow_dispatch:

permissions:
  contents: read

jobs:
  watch:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Compare and open or update the issue
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          found=$(python3 .github/scripts/upstream_watch.py)
          if [ -z "$found" ]; then
            echo "CI tests the newest runtime and editor; nothing to do"
            exit 0
          fi
          title="A newer OpenPLC runtime or editor is out"
          body="$found

          canworks stays pinned until the pin moves on purpose: for the runtime set docker/local-runtime/runtime-version and TESTED_RUNTIME in tools/deploy/canworks/devices/plan.py and check docker/local-runtime/bootloader-version against upstream's bootloader/VERSION; for the editor check its remote device and Modbus master config against tools/deploy/canworks/openplcmodbus.py and test/openplc_modbus/run.py; then update .github/ci/upstream-watch.json and let the full CI run. Installs and the configurator's Devices page keep devices on the pin.

          Opened by .github/workflows/runtime-watch.yml."
          gh label create runtime-update --color c5def5 --description "A newer OpenPLC runtime or editor than CI tests" --force
          number=$(gh issue list --label runtime-update --state open --json number --jq '.[0].number // empty')
          if [ -n "$number" ]; then
            gh issue edit "$number" --title "$title" --body "$body"
            echo "updated issue #$number"
          else
            gh issue create --title "$title" --body "$body" --label runtime-update
          fi
