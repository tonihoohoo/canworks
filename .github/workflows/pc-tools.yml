name: PC tools (Windows, macOS, Linux)

# The configurator, deploy tool and diagnostics as a developer installs them on
# a Windows PC, Mac or Linux desktop (canopen-pc-install): the wheel installed
# with uv and a uv-managed Python, no Python on the runner needed. Slow (macOS
# and Windows runners), so it runs where a release can follow: a push to main
# that changes the package's pyproject.toml (a version bump; the automatic
# release waits for this run), a release tag, or "Run workflow" (on a pull
# request's branch when a change needs these systems checked before merging).
# Pull requests do not run it; the Linux tests in CI cover the same code.
on:
  push:
    branches: [main]
    tags: ["deploy-v*"]
    paths:
      - "tools/deploy/pyproject.toml"
  workflow_dispatch:

# Runs on main and tags never cancel each other; a second manual run on the
# same branch cancels the first.
concurrency:
  group: pc-tools-${{ github.event_name == 'workflow_dispatch' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'workflow_dispatch' }}

jobs:
  pc-tools:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-14, ubuntu-24.04, ubuntu-24.04-arm]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v6

      - name: Build the wheel
        run: uv build --wheel --out-dir dist tools/deploy

      - name: Install it as the docs say (uv tool install, uv-managed Python 3.12)
        run: |
          uv tool install --python 3.12 --managed-python dist/*.whl
          echo "$(uv tool dir --bin)" >> "$GITHUB_PATH"

      - name: Deploy tool and configurator tests
        # Page tests (Playwright) and the DCF parity check (C++ canopen_check)
        # run on Linux only; they skip here and say why.
        run: >
          uv run --no-project --python 3.12 --managed-python --with jsonschema --with cantools
          python -m unittest discover -v -s tools/deploy/tests -t tools/deploy

      - name: Release tag check tests
        run: uv run --no-project --python 3.12 --managed-python python -m unittest discover -v -s test/pc-tools

      - name: Smoke run of the installed commands
        run: |
          version=$(uv run --no-project --python 3.12 --managed-python python -c \
            "import re; print(re.search(r'^version = \"(.+)\"', open('tools/deploy/pyproject.toml').read(), re.M).group(1))")
          uv run --no-project --python 3.12 --managed-python python test/pc-tools/smoke.py "$version"
