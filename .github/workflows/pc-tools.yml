name: PC tools (Windows, macOS, Linux)

# The configurator, deploy tool and diagnostics as a developer installs them on
# a Windows PC, Mac or Linux desktop (canopen-pc-install): the wheel installed
# with uv and a uv-managed Python, no Python on the runner needed. Slow (macOS
# and Windows runners), so it runs where a release can follow: a push to main
# that changes the package's pyproject.toml (a version bump; the automatic
# release waits for this run), a release tag, or "Run workflow" (on a pull
# request's branch when a change needs these systems checked before merging).
# Pull requests do not run it; the Linux tests in CI cover the same code.
on:
  push:
    branches: [main]
    tags: ["deploy-v*"]
    paths:
      - "tools/deploy/pyproject.toml"
  workflow_dispatch:

# Runs on main and tags never cancel each other; a second manual run on the
# same branch cancels the first.
concurrency:
  group: pc-tools-${{ github.event_name == 'workflow_dispatch' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'workflow_dispatch' }}

permissions:
  contents: read

jobs:
  pc-tools:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-14, ubuntu-24.04, ubuntu-24.04-arm]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0

      - name: Build the wheel
        run: uv build --wheel --out-dir dist tools/deploy

      - name: The lock covers every Python the package allows (uv run from a checkout on Windows)
        run: uv run --no-project python scripts/check-lock.py

      - name: The locked dependency versions, as a release exports them
        run: |
          uv export --project tools/deploy --frozen --no-hashes --no-emit-project --no-dev \
            --format requirements-txt -q -o "$RUNNER_TEMP/constraints.txt"
          echo "CONSTRAINTS=$RUNNER_TEMP/constraints.txt" >> "$GITHUB_ENV"

      - name: Install it with the one-line installer, as the docs say (uv-managed Python 3.14)
        env:
          UV_MANAGED_PYTHON: "1"
        run: |
          wheel=$(ls dist/*.whl)
          if [ "$RUNNER_OS" = Windows ]; then
            # Windows PowerShell 5.1, the one every Windows 10/11 has
            powershell -NoProfile -ExecutionPolicy RemoteSigned -File scripts/install-pc.ps1 -Wheel "$wheel" \
              -Constraints "$(cygpath -w "$CONSTRAINTS")"
          else
            sh scripts/install-pc.sh --wheel "$wheel" --constraints "$CONSTRAINTS"
          fi
          echo "$(uv tool dir --bin)" >> "$GITHUB_PATH"

      - name: On a PC without uv, the installer brings uv from its checked release zip (Windows)
        # setup-uv's uv is hidden from PATH, so install-pc.ps1 downloads uv's
        # zip, checks its SHA-256 and puts uv.exe in ~/.local/bin
        # (canopen-pc-install, uv from a checked zip on Windows).
        if: runner.os == 'Windows'
        env:
          UV_MANAGED_PYTHON: "1"
        run: |
          wheel=$(ls dist/*.whl)
          nouv=$(echo "$PATH" | tr ':' '\n' | while read -r d; do [ -e "$d/uv.exe" ] || [ -e "$d/uv" ] || printf '%s:' "$d"; done)
          PATH="$nouv" powershell -NoProfile -ExecutionPolicy RemoteSigned -File scripts/install-pc.ps1 -Wheel "$wheel" -NoShortcut
          "$USERPROFILE/.local/bin/uv.exe" --version

      - name: Only runtime dependencies in the tools' environment
        # The installer's override drops can-j1939's pytest requirement
        # (canopen-pc-install); the J1939 simulator starts without it.
        run: |
          if [ "$RUNNER_OS" = Windows ]; then py="$(uv tool dir)/canworks/Scripts/python.exe"; else py="$(uv tool dir)/canworks/bin/python"; fi
          "$py" -c "import importlib.util, sys; sys.exit('pytest is installed' if importlib.util.find_spec('pytest') else 0)"
          canworks-j1939-sim --help > /dev/null

      - name: Deploy tool and configurator tests
        # Page tests (Playwright) and the DCF parity check (C++ canopen_check)
        # run on Linux only; they skip here and say why.
        # The locked versions, as the tools' environment has them.
        run: >
          uv run --no-project --python 3.14 --managed-python --with-requirements "$CONSTRAINTS"
          python -m unittest discover -v -s tools/deploy/tests -t tools/deploy

      - name: Release tag check tests
        run: uv run --no-project --python 3.14 --managed-python python -m unittest discover -v -s test/pc-tools

      - name: Smoke run of the installed commands
        run: |
          version=$(uv run --no-project --python 3.14 --managed-python python -c \
            "import re; print(re.search(r'^version = \"(.+)\"', open('tools/deploy/pyproject.toml').read(), re.M).group(1))")
          uv run --no-project --python 3.14 --managed-python python test/pc-tools/smoke.py "$version"

      - name: Update from inside the tools, end to end (pc-tools-self-update)
        # A running configurator updates to a made-up newer release served by a
        # local stand-in for GitHub and comes back on the same port with the same
        # session; on Windows a process held open in the tools' environment
        # first stops the update cleanly. Runs last: it installs the version
        # under test again at the end.
        env:
          UV_MANAGED_PYTHON: "1"
        run: |
          version=$(uv run --no-project --python 3.14 --managed-python python -c \
            "import re; print(re.search(r'^version = \"(.+)\"', open('tools/deploy/pyproject.toml').read(), re.M).group(1))")
          CANWORKS_E2E_CONSTRAINTS="$CONSTRAINTS" \
            uv run --no-project --python 3.14 --managed-python python test/pc-tools/update_e2e.py "$version" "$(ls dist/*.whl)"
