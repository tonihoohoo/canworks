name: Local simulator runtime

# The image of the local simulator runtime (canopen-local-runtime,
# docker/local-runtime/Dockerfile) built from the pinned upstream runtime
# image, and canworks-sim-runtime run against it with a real PLC program
# (test/local-runtime/run.sh), then the virtual example on it
# (test/virtual-example/run.sh, docs/tour.md). Pull requests run it when they
# touch what goes into the image, the command or the example; it also runs
# weekly (upstream drift) and by hand. The arm64 image is built (not run) on an arm64 runner. Publishing is
# release-deploy.yml's job.
on:
  pull_request:
    paths:
      - "docker/local-runtime/**"
      - ".dockerignore"
      - "plugin/**"
      - "CMakeLists.txt"
      - "scripts/install-stock.sh"
      - "scripts/build-lely.sh"
      - "tools/editor-hook/**"
      - "tools/deploy/canworks/localruntime.py"
      - "tools/deploy/canworks/cli.py"
      - "tools/deploy/canworks/diag.py"
      - "test/local-runtime/**"
      - "examples/**"
      - "test/virtual-example/**"
      - ".github/workflows/local-runtime.yml"
  schedule:
    - cron: "41 4 * * 1"  # Mondays 04:41 UTC
  workflow_dispatch:

concurrency:
  group: local-runtime-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  amd64:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Build the image
        run: |
          runtime=$(cat docker/local-runtime/runtime-version)
          docker build -f docker/local-runtime/Dockerfile \
            --build-arg RUNTIME_IMAGE="ghcr.io/autonomy-logic/openplc-runtime:$runtime" \
            --build-arg TOOLS_VERSION=ci -t canworks-sim-runtime:ci .
          size=$(docker image inspect canworks-sim-runtime:ci --format '{{.Size}}')
          echo "image size: $((size / 1000000)) MB"
          if [ "$size" -gt 1600000000 ]; then echo "::warning::the image is $((size / 1000000)) MB"; fi

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"

      - name: Install the PC tools
        run: python -m pip install -q ./tools/deploy

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22

      - name: Cache STruC++
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/.cache/canworks/strucpp
          key: strucpp-${{ runner.os }}-${{ hashFiles('scripts/fetch-strucpp.sh') }}

      - name: Fetch STruC++ (compiles the test's PLC program)
        id: strucpp
        run: echo "cli=$(scripts/fetch-strucpp.sh)" >> "$GITHUB_OUTPUT"

      - name: canworks-sim-runtime with the image and a PLC program
        run: test/local-runtime/run.sh --image canworks-sim-runtime:ci --strucpp "${{ steps.strucpp.outputs.cli }}"

      - name: The virtual example on the image (the tour's command-line steps and its test scenarios)
        env:
          JUNIT_DIR: ${{ runner.temp }}/junit
        run: test/virtual-example/run.sh --image canworks-sim-runtime:ci --strucpp "${{ steps.strucpp.outputs.cli }}"

      - name: Scenario reports
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: virtual-example-junit
          path: ${{ runner.temp }}/junit
          if-no-files-found: ignore

  arm64:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Build the arm64 image
        run: |
          runtime=$(cat docker/local-runtime/runtime-version)
          docker build -f docker/local-runtime/Dockerfile \
            --build-arg RUNTIME_IMAGE="ghcr.io/autonomy-logic/openplc-runtime:$runtime" \
            --build-arg TOOLS_VERSION=ci -t canworks-sim-runtime:ci .
          docker run --rm --entrypoint ldd canworks-sim-runtime:ci /opt/canworks/lib/libcanworks_plugin.so |
            tee ldd.txt
          ! grep -q "not found" ldd.txt
