name: Local runtime

# The local runtime (canopen-local-runtime): canworks-local-runtime with the
# pinned upstream runtime image and the canworks-bridge image built here
# (docker/bridge/Dockerfile), run with a real PLC program through the
# runtime's own Modbus master (test/local-runtime/run.sh), then the virtual
# example on it (test/virtual-example/run.sh, docs/tour.md). Pull requests run
# it when they touch what goes into the bridge image, the command or the
# example; it also runs weekly (upstream drift) and by hand. The arm64 bridge
# image is built (not run) on an arm64 runner. Publishing is
# release-deploy.yml's job.
on:
  pull_request:
    paths:
      - "docker/local-runtime/**"
      - "docker/bridge/**"
      - ".dockerignore"
      - "plugin/**"
      - "CMakeLists.txt"
      - "scripts/install-bridge.sh"
      - "scripts/build-lely.sh"
      - "scripts/dcf-tools-constraints.txt"
      - "tools/deploy/uv.lock"
      - "tools/deploy/canworks/localruntime.py"
      - "tools/deploy/canworks/cli.py"
      - "tools/deploy/canworks/diag.py"
      - "tools/deploy/canworks/openplcmodbus.py"
      - "tools/deploy/canworks/library/**"
      - "test/local-runtime/**"
      - "test/openplc_modbus/run.py"
      - "examples/**"
      - "test/virtual-example/**"
      - ".github/workflows/local-runtime.yml"
  schedule:
    - cron: "41 4 * * 1"  # Mondays 04:41 UTC
  workflow_dispatch:

concurrency:
  group: local-runtime-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  amd64:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: ./.github/actions/locked-versions

      - name: Build the bridge image
        run: docker build -f docker/bridge/Dockerfile --build-arg TOOLS_VERSION=ci -t canworks-bridge:ci .

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"

      - name: Install the PC tools
        run: python -m pip install -q ./tools/deploy

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22

      - name: Cache STruC++
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/canworks/strucpp
          key: strucpp-${{ runner.os }}-${{ hashFiles('scripts/fetch-strucpp.sh') }}

      - name: Fetch STruC++ (compiles the test's PLC program)
        id: strucpp
        run: echo "cli=$(scripts/fetch-strucpp.sh)" >> "$GITHUB_OUTPUT"

      - name: canworks-local-runtime with the bridge image and a PLC program
        run: test/local-runtime/run.sh --image canworks-bridge:ci --strucpp "${{ steps.strucpp.outputs.cli }}"

      - name: The virtual example on the local runtime (the tour's command-line steps and its test scenarios)
        env:
          JUNIT_DIR: ${{ runner.temp }}/junit
        run: test/virtual-example/run.sh --image canworks-bridge:ci --strucpp "${{ steps.strucpp.outputs.cli }}"

      - name: Scenario reports
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: virtual-example-junit
          path: ${{ runner.temp }}/junit
          if-no-files-found: ignore

  arm64:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: ./.github/actions/locked-versions

      - name: Build the arm64 bridge image
        run: |
          docker build -f docker/bridge/Dockerfile --build-arg TOOLS_VERSION=ci -t canworks-bridge:ci .
          docker run --rm --entrypoint ldd canworks-bridge:ci /opt/canworks/bin/canworks-bridge | tee ldd.txt
          ! grep -q "not found" ldd.txt
          docker run --rm canworks-bridge:ci --version
